name: Release packages

on:
  push:
    branches: ['develop']

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install Dependencies
        run: yarn

      - name: Build, lint and test packages
        run: yarn turbo run build lint test --filter=./packages/*

      # Keep the established build runtime above; npm OIDC needs Node >=22.14
      # and npm >=11.5.1. Node 24 supplies a compatible publishing runtime.
      - name: Setup publishing runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check npm trusted-publishing support
        run: |
          node -e 'const v = require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(); const [a,b,c] = v.split(".").map(Number); if (!(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))))) throw new Error("npm >=11.5.1 required for trusted publishing"); console.log("Publishing with Node " + process.version + ", npm " + v);'

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: node node_modules/@changesets/cli/bin.js publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
